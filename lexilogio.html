  THEMES.forEach((T,i)=>{const n=T.w.filter((x,b)=>S.w[i+"-"+b]).length;h+=`<button class="row" onclick="theme(${i})"><span class="num" style="background:${col(i)}">${i+1}</span><span class="tt" dir="auto">${esc(tT(i))}</span><span class="st">${n?(n===T.w.length?"✅":n+"/"+T.w.length):""}</span></button>`});

function wordRow(id){const x=W(id),k=isK(id);return `<div class="word" id="wr-${id}"><div class="bx"><div class="en">${esc(x.en)} ${k?"✅":""}</div><div class="gr" dir="auto">${esc(x.gr)}</div><div class="exs">${esc(x.ex)}</div></div>${spk(x.en+(x.ex?". "+x.ex:""))}<button class="kbtn${k?" on":""}" onclick="toggleK('${id}')" aria-label="${k?t("unmarkK"):t("markK")}" title="${k?t("unmarkK"):t("markK")}">${k?"↩":"✔"}</button>${id[0]==="u"?`<button class="kbtn" style="color:var(--red);border-color:#f3c0c0" onclick="delMy('${id}')" aria-label="${t("delW")}">🗑</button>`:""}</div>`}

function delMy(id){if(!confirm(t("delW")+"?"))return;S.c[+id.slice(2)]=null;delete S.w[id];save();toast(t("deleted"));const r=document.getElementById("wr-"+id);if(r)r.remove()}
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")}
const MM={fil:"tl",zh:"zh-CN"};
function fetchJ(u){const c=new AbortController();const tm=setTimeout(()=>c.abort(),9000);return fetch(u,{signal:c.signal}).then(r=>{clearTimeout(tm);if(!r.ok)throw 0;return r.json()})}
function trans(q,from,to){return fetchJ("https://api.mymemory.translated.net/get?q="+encodeURIComponent(q)+"&langpair="+(MM[from]||from)+"|"+(MM[to]||to)).then(j=>{const x=j&&j.responseData&&j.responseData.translatedText;if(!x||/MYMEMORY|QUERY LENGTH|INVALID/i.test(x))return "";return x.toLowerCase()===x.toUpperCase()?x:(x===x.toUpperCase()?x.toLowerCase():x)}).catch(()=>"")}
function dict(w){return fetchJ("https://api.dictionaryapi.dev/api/v2/entries/en/"+encodeURIComponent(w.toLowerCase())).then(j=>{let def="",ex="";(j||[]).forEach(e=>(e.meanings||[]).forEach(m=>(m.definitions||[]).forEach(d=>{if(!def)def=(m.partOfSpeech?"("+m.partOfSpeech+") ":"")+d.definition;if(!ex&&d.example)ex=d.example})));return{def,ex}}).catch(()=>({def:"",ex:""}))}
async function addWord(){
  const raw=document.getElementById("sq").value.trim();if(!raw)return;
  const lc=getLang()||"el";
  const d=document.createElement("div");d.className="modal";d.id="modal";
  d.innerHTML=`<div class="box" dir="auto"><h2 style="color:var(--teal)">${t("addTitle")}</h2><div>${t("looking")}</div></div>`;
  d.addEventListener("click",e=>{if(e.target===d)closeModal()});document.body.appendChild(d);
  const latin=/^[A-Za-z][A-Za-z '\-]*$/.test(raw);
  let en=latin?raw:"",gr=latin?"":raw;
  if(!latin&&lc!=="en")en=await trans(raw,lc,"en");
  const D=en?await dict(en):{def:"",ex:""};
  if(latin&&lc!=="en")gr=await trans(raw,"en",lc);
  if(lc==="en"&&!gr)gr=D.def.replace(/^\([^)]*\) /,"");
  const box=document.querySelector("#modal .box");if(!box)return;
  box.innerHTML=`<h2 style="color:var(--teal)">${t("addTitle")}</h2>
  ${(!D.def&&!gr)?`<div class="def">${t("offline")}</div>`:""}
  <div class="lbl">${t("fEn")}</div><div style="display:flex;gap:8px;align-items:center"><input class="fld" id="nEn" dir="ltr" value="${esc(en)}">${en?spk(en):""}</div>
  ${D.def?`<div class="lbl">${t("fDef")}</div><div class="def" dir="ltr">${esc(D.def)}</div>`:""}
  <div class="lbl">${t("fGr")}</div><input class="fld" id="nGr" dir="auto" value="${esc(gr)}">
  <div class="lbl">${t("fEx")}</div><input class="fld" id="nEx" dir="ltr" value="${esc(D.ex)}">
  <button class="big go" onclick="saveWord()">${t("saveW")}</button><button class="big sec" style="margin-top:10px" onclick="closeModal()">${t("cancel")}</button>`;
  window._def=D.def;
}
function saveWord(){
  const en=document.getElementById("nEn").value.trim(),gr=document.getElementById("nGr").value.trim(),ex=document.getElementById("nEx").value.trim();
  if(!en||!gr){toast(t("needBoth"));return}
  if(!S.c)S.c=[];
  if(S.c.some(c=>c&&c.en.toLowerCase()===en.toLowerCase())){toast(t("exists"));return}
  S.c.push({en,gr,ex,def:window._def||""});S.w["u-"+(S.c.length-1)]={b:0,d:dayNum()};save();closeModal();toast(t("added"));
  const q=document.getElementById("sq");if(q){q.value=en;search(en)}
}
function search(v){
  const r=document.getElementById("sres");v=norm(v.trim());
  if(v.length<2){r.innerHTML="";return}
  const raw=document.getElementById("sq").value.trim();
  const pool=[...myIds(),...ALL];
  const hits=pool.filter(id=>{const x=W(id);return norm(x.en).includes(v)||norm(x.gr).includes(v)}).slice(0,15);
  const exact=pool.some(id=>{const x=W(id);return norm(x.en)===v||norm(x.gr).split(/[,;\/]\s*/).includes(v)});
  const add=(!exact&&v.length>=2)?`<div class="addbox" dir="auto">${t("notIn",esc(raw))}<button class="big go" onclick="addWord()">${t("addIt")}</button></div>`:"";
  r.innerHTML=hits.map(wordRow).join("")+add;
}

function theme(i){
  window.scrollTo(0,0);
  const T=THEMES[i], left=newList(PER_DAY,i).length;
  let h=topBar(true)+`<div class="card"><h2 style="margin:0 0 10px" dir="auto">${i+1}. ${esc(tT(i))}</h2>${left?`<button class="big go" onclick="startTheme(${i})">${t("learnN",left)}</button>`:`<div class="done-msg">${t("allSeen")}</div><button class="big sec" onclick="reviewTheme(${i})">${t("testTheme")}</button>`}</div><div class="list">`;

/* ---------- Κάρτες και τεστ ---------- */
let L=null;
function startDaily(){const nw=newList(PER_DAY);const due=shuffle(dueList()).slice(0,10);begin(nw,due,true)}
function startTheme(i){begin(newList(PER_DAY,i),[],false)}
function reviewTheme(i){begin([],shuffle(THEMES[i].w.map((x,b)=>i+"-"+b)).slice(0,10),false)}
function begin(nw,due,daily){
  if(!nw.length&&!due.length){toast(t("noWords"));return}
  L={nw,due,daily,pos:0,qs:[],qpos:0,score:0,res:[]};
  if(nw.length)card();else quizStart();
}
function card(){
  window.scrollTo(0,0);
  const x=W(L.nw[L.pos]);
  let h=topBar(true)+`<div class="qnum">${t("newN",L.pos+1,L.nw.length)}</div><div class="dots">${L.nw.map((_,k)=>`<i class="${k<L.pos?"g":k===L.pos?"c":""}"></i>`).join("")}</div>`;
  h+=`<div class="card flash"><div class="qnum" dir="auto">${esc(tT(x.t))}</div><div class="en">${esc(x.en)}</div>${spk(x.en)}<div class="gr" dir="auto">${esc(x.gr)}</div><div class="exs">${esc(x.ex)}</div>${x.ex?spk(x.ex):""}<button class="big go" style="margin-top:20px" onclick="nextCard()">${L.pos===L.nw.length-1?t("toTest"):t("nextWord")}</button><button class="big knowbig" onclick="knowNow()">${t("knowIt")}</button></div>`;
  app.innerHTML=h;autoSay(x.en);
}
function reveal(){
  const x=W(L.nw[L.pos]),last=L.pos===L.nw.length-1;
  document.getElementById("rev").innerHTML=`<div class="gr" dir="auto">${esc(x.gr)}</div><div class="exs">${esc(x.ex)}</div>${spk(x.ex)}<button class="big go" style="margin-top:20px" onclick="nextCard()">${last?t("toTest"):t("nextWord")}</button>`;
}
function knowNow(){
  const id=L.nw[L.pos];S.w[id]={b:5,d:dayNum()+30};save();L.nw.splice(L.pos,1);toast(t("markedKnown"));
  if(L.pos<L.nw.length)card();else if(L.nw.length||L.due.length)quizStart();else home();
}
function nextCard(){L.pos++;if(L.pos<L.nw.length)card();else quizStart()}
function quizStart(){
  const ids=shuffle([...L.nw,...L.due]);
  L.qs=ids.map((id,k)=>({id,rev:k%2===1}));L.qpos=0;L.score=0;L.res=[];showQ();
}
function distract(id,field){
  const x=W(id);const same=(x.t==="u"?myIds():THEMES[x.t].w.map((_,b)=>x.t+"-"+b)).filter(o=>o!==id);
  let pool=shuffle(same);if(pool.length<2)pool=pool.concat(shuffle(ALL).filter(o=>o!==id));
  const out=[];for(const o of pool){const v=W(o)[field];if(v!==x[field]&&!out.includes(v))out.push(v);if(out.length===2)break}
  return out;
}
function showQ(){
  window.scrollTo(0,0);
  const it=L.qs[L.qpos],x=W(it.id);
  const field=it.rev?"en":"gr", correct=x[field];
  const opts=shuffle([correct,...distract(it.id,field)]);
  let h=topBar(true)+`<div class="card"><div class="qnum">${t("testN",L.qpos+1,L.qs.length)}</div><div class="dots">${L.qs.map((_,k)=>`<i class="${k<L.qpos?(L.res[k]?"g":"r"):k===L.qpos?"c":""}"></i>`).join("")}</div>`;
  if(it.rev)h+=`<div class="q" dir="auto" style="color:var(--teal)">${esc(x.gr)}</div><div class="qh">${t("whichEn")}</div>`;
  else h+=`<div class="q">${esc(x.en)} ${spk(x.en)}</div><div class="qh">${t("meaning")}</div>`;
  opts.forEach(o=>h+=`<button class="opt" dir="auto" data-o="${encodeURIComponent(o)}" onclick="answer(this)">${esc(o)}</button>`);
  app.innerHTML=h+`<div id="fb"></div></div>`;
  if(!it.rev)autoSay(x.en);
}
function answer(btn){
  const it=L.qs[L.qpos],x=W(it.id),field=it.rev?"en":"gr",correct=x[field];
  const ok=decodeURIComponent(btn.dataset.o)===correct;
  document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(decodeURIComponent(b.dataset.o)===correct)b.classList.add("right")});
  if(!ok)btn.classList.add("wrong");
  L.res[L.qpos]=ok;if(ok)L.score++;
  const st=S.w[it.id]||{b:0,d:0};
  if(ok){st.b=Math.min(5,(S.w[it.id]?st.b+1:1))}else st.b=0;
  st.d=dayNum()+(ok?INT[st.b]:1);S.w[it.id]=st;save();
  const last=L.qpos===L.qs.length-1;
  document.getElementById("fb").innerHTML=`<div class="fb ${ok?"g":"r"}">${ok?t("right"):t("wrongTom")}<div class="rowb">${spk(x.en+". "+x.ex)}<span dir="auto"><b>${esc(x.en)}</b> = ${esc(x.gr)}</span></div><div style="font-style:italic;font-weight:500;margin-top:6px">${esc(x.ex)}</div></div><button class="big go" style="margin-top:16px" onclick="nextQ()">${last?t("finishBtn"):t("nextBtn")}</button>`;
  if(it.rev&&ok)autoSay(x.en);
  document.getElementById("fb").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function nextQ(){L.qpos++;if(L.qpos<L.qs.length)showQ();else finish()}
function finish(){
  window.scrollTo(0,0);
  if(L.daily){S.last=dayNum();save()}
  const tot=L.qs.length,sc=L.score,st=sc>=tot?3:(sc>=tot*0.7?2:1);
  let h=topBar(true)+`<div class="card center"><div class="stars">${"⭐".repeat(st)}${"☆".repeat(3-st)}</div><h2 style="margin:4px 0">${sc===tot?t("perfect"):sc>=tot*0.7?t("veryGood"):t("goodTry")}</h2><div style="font-size:1.1em">${t("score",sc,tot)}</div><div class="qh" style="margin-top:10px">${t("comeBack")}</div></div>`;
  L.ids=L.qs.map(x=>x.id);
  h+=`<button class="big go" onclick="home()">${t("homeBtn")}</button>`;
  const sp2=s=>{const k=s.search(/\s/);return k>0&&/^\P{L}/u.test(s)?`<span class="ti">${s.slice(0,k)}</span><span>${s.slice(k+1)}</span>`:s};
  h+=`<div class="grid2"><button class="tile${L.nw.length?"":" full"}" onclick="again()">${sp2(t("againTest"))}</button>`;
  if(L.nw.length) h+=`<button class="tile" onclick="cardsAgain()">${sp2(t("againCards"))}</button>`;
  h+=`</div>`;
  if(L.nw.length){h+=`<details class="lvl"><summary>${t("todaysNew")} <span class="st">${L.nw.length}</span></summary><div class="list">${L.nw.map(wordRow).join("")}</div></details>`}
  app.innerHTML=h;
}
function again(){const ids=L.ids;L={nw:[],due:ids,daily:false,pos:0,qs:[],qpos:0,score:0,res:[]};quizStart()}
function cardsAgain(){begin(L.nw.slice(),[],false)}
startApp(null,home);
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
</body>
