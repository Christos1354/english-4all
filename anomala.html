grammar:"📘 Γραμματική",vocab:"📚 Λεξιλόγιο",stop:"⏹ Στοπ"}
:{home:"← Home",title:"📋 Irregular verbs & exceptions",verbs:"Irregular verbs ({0})",help:"Three forms: <b>base</b> (go) · <b>Past</b> – yesterday (went) · <b>Past participle</b> – with have (have gone). Press 🔊 to listen.",

function t(k,...a){let s=UI[k];a.forEach((v,i)=>{s=s.split("{"+i+"}").join(v)});return s}
const app=document.getElementById("app");
let FS=22;try{const z=JSON.parse(localStorage.getItem("lexilogio_v1")||"{}");if(z.fs)FS=z.fs}catch(e){}
document.documentElement.style.setProperty("--fs",FS+"px");
function fontSize(d){FS=Math.max(18,Math.min(30,FS+d));document.documentElement.style.setProperty("--fs",FS+"px")}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
let voice=null;
function pickVoice(){const vs=speechSynthesis.getVoices();voice=vs.find(v=>/en[-_]GB/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(x){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(x);u.lang="en-GB";if(voice)u.voice=voice;u.rate=.8;speechSynthesis.speak(u)}
function stopSay(){if("speechSynthesis" in window)speechSynthesis.cancel()}
function spk(x){return `<button class="spk" onclick='say(${JSON.stringify(x).replace(/'/g,"&#39;")})' aria-label="Listen">🔊</button>`}
function speakForms(v){return [v[0],v[1],v[2]].map(f=>f.replace(/\s*\(.*?\)/g,"").replace(/ \/ /g," or ")).join(", ")}
function toast(m){const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")}
function topBar(){return `<div class="top"><a class="back" href="index.html" style="text-decoration:none;white-space:nowrap">${t("home")}</a><div class="tright"><button class="snd stop" style="font-size:.8em" onclick="stopSay()">${t("stop")}</button><div class="sz"><button onclick="fontSize(-2)">A−</button><button onclick="fontSize(2)">A+</button></div></div></div>`}
function vRow(v){return `<tr><td><span class="f">${esc(v[0])}</span>${GR?`<span class="m">${esc(v[3])}</span>`:""}</td><td class="f">${esc(v[1])}</td><td class="f">${esc(v[2])}</td><td>${spk(speakForms(v))}</td></tr>`}
function table(list){return list.length?`<table class="vt"><tr><th>${t("b")}</th><th>${t("p")}</th><th>${t("pp")}</th><th></th></tr>${list.map(vRow).join("")}</table>`:`<div class="word">${t("none")}</div>`}
function home(){
  window.scrollTo(0,0);
  let h=topBar()+`<div class="card hero"><h1 style="font-size:1.15em">${t("title")}</h1><div class="small" style="font-size:.85em">${t("help")}</div></div>`;
  h+=`<button class="big go" onclick="quiz()">${t("quiz")}</button>`;
  h+=`<input class="search" id="vq" dir="auto" style="margin-top:14px" placeholder="${t("search")}" oninput="find(this.value)"><div id="vres"></div>`;
  h+=`<details class="lvl"><summary>${t("verbs",V.length)}</summary><div style="padding:0 8px 8px">${table(V)}</div></details>`;
  h+=`<h3 style="margin:22px 4px 6px">${t("exc")}</h3>`;
  X.forEach(x=>{h+=`<details class="lvl"><summary>${GR?x[0]:x[1]}</summary><div style="padding:0 12px 12px"><div class="rule">${GR?x[2]:x[3]}</div>${x[4].map(e=>`<div class="ex" style="display:flex;gap:10px;align-items:center"><div style="flex:1"><b>${esc(e[0])}</b>${GR?`<div class="m" style="font-size:.85em;color:var(--soft)">${esc(e[1])}</div>`:""}</div>${spk(e[0].replace(/→/g,",").replace(/ \/ /g," or ").replace(/\s*\(.*?\)/g,""))}</div>`).join("")}</div></details>`});
  h+=`<div class="grid2" style="margin-top:22px"><a class="tile" href="index.html">${t("grammar")}</a><a class="tile" href="lexilogio.html">${t("vocab")}</a></div>`;
  app.innerHTML=h;
}
function find(q){
  const r=document.getElementById("vres");q=norm(q.trim());
  if(q.length<2){r.innerHTML="";return}
  r.innerHTML=table(V.filter(v=>[v[0],v[1],v[2]].some(f=>norm(f).includes(q))||(GR&&norm(v[3]).includes(q))).slice(0,12));
}
/* ---------- Τεστ ---------- */
let Q=null;
function wrongForm(b){if(b.endsWith("e"))return b+"d";if(/[^aeiou]y$/.test(b))return b.slice(0,-1)+"ied";return b+"ed"}
function first(f){return f.split(" / ")[0].replace(/\s*\(.*?\)/g,"")}
function quiz(){
  const pool=shuffle(V.filter(v=>v[0]!=="be"&&!(first(v[1])===v[0]&&first(v[2])===v[0]))).slice(0,10);
  Q={items:pool.map((v,k)=>({v,pp:k%2===1})),pos:0,score:0};showQ();
}
function showQ(){
  window.scrollTo(0,0);
  const it=Q.items[Q.pos],v=it.v,correct=first(it.pp?v[2]:v[1]);
  const others=[...new Set([wrongForm(v[0]),first(it.pp?v[1]:v[2]),v[0]])].filter(o=>o!==correct);
  while(others.length<2){const o=first(shuffle(V)[0][it.pp?2:1]);if(o!==correct&&!others.includes(o))others.push(o)}
  const opts=shuffle([correct,others[0],others[1]]);
  let h=topBar()+`<div class="card"><div class="qnum">${Q.pos+1} / ${Q.items.length}</div><div class="dots">${Q.items.map((_,k)=>`<i class="${k<Q.pos?(Q.items[k].ok?"g":"r"):k===Q.pos?"c":""}"></i>`).join("")}</div>`;
  h+=`<div class="qh" style="margin-top:14px">${it.pp?t("qPP"):t("qP")}</div><div class="q">${esc(v[0])} ${spk(v[0])}</div>${GR?`<div class="qh">(${esc(v[3])})</div>`:""}`;
  opts.forEach(o=>h+=`<button class="opt" data-o="${esc(o)}" onclick="answer(this)">${esc(o)}</button>`);
  app.innerHTML=h+`<div id="fb"></div></div>`;
}
function answer(btn){
  const it=Q.items[Q.pos],v=it.v,correct=first(it.pp?v[2]:v[1]),ok=btn.dataset.o===correct;
  document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.dataset.o===correct)b.classList.add("right")});
  if(!ok)btn.classList.add("wrong");it.ok=ok;if(ok)Q.score++;
  const last=Q.pos===Q.items.length-1;
  document.getElementById("fb").innerHTML=`<div class="fb ${ok?"g":"r"}">${ok?t("right"):t("wrong")}<div class="rowb">${spk(speakForms(v))}<span><b>${esc(v[0])} – ${esc(v[1])} – ${esc(v[2])}</b></span></div></div><button class="big go" style="margin-top:16px" onclick="nextQ()">${last?t("end"):t("next")}</button>`;
  document.getElementById("fb").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function nextQ(){Q.pos++;if(Q.pos<Q.items.length)showQ();else{window.scrollTo(0,0);const tot=Q.items.length,sc=Q.score,st=sc>=tot?3:(sc>=tot*.7?2:1);app.innerHTML=topBar()+`<div class="card center"><div class="stars">${"⭐".repeat(st)}${"☆".repeat(3-st)}</div><div style="font-size:1.15em;font-weight:700">${t("score",sc,tot)}</div></div><button class="big go" onclick="quiz()">${t("again")}</button><button class="big sec" style="margin-top:12px" onclick="home()">${t("back")}</button>`}}
home();
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
