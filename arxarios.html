function voiceList(){
  const L=document.getElementById("vlist"),Pp=document.getElementById("vsp");if(!L||!Pp)return;
  const r=VS.rate||.85;
  Pp.innerHTML=[[.6,"s1"],[.75,"s2"],[.85,"s3"],[1,"s4"]].map(([v,k])=>`<button class="${Math.abs(r-v)<.01?"on":""}" onclick="setRate(${v})">${t(k)}</button>`).join("");
  const vs=enVoices();
  L.innerHTML=vs.length?vs.map((v,i)=>{const on=voice&&v.voiceURI===voice.voiceURI;return `<button class="vrow${on?" on":""}" dir="ltr" onclick="setVoice(${i})"><span>${vFlag(v.lang)}</span><b>${esc(v.name)}</b><span class="vl">${v.lang}</span><span>${on?"✔":"▶"}</span></button>`}).join(""):`<div>${t("noV")}</div>`;
}
function setVoice(i){const v=enVoices()[i];if(!v)return;voice=v;VS.uri=v.voiceURI;vSave();voiceList();say(V_SAMPLE)}
function setRate(r){VS.rate=r;vSave();voiceList();say(V_SAMPLE)}
function closeModal(){const m=document.getElementById("modal");if(m)m.remove()}
function openDonate(){
  closeModal();const d=document.createElement("div");d.className="modal";d.id="modal";
  d.innerHTML=`<div class="box" dir="auto"><h2 style="color:#b8860b">${t("dT")}</h2><div>${t("dX")}</div>
  <a class="big paybtn pp" href="https://paypal.me/ChristosMagides" target="_blank" rel="noopener">PayPal</a>
  <a class="big paybtn rv" href="https://revolut.me/christs5s2" target="_blank" rel="noopener">Revolut</a>
  <div class="center" style="margin-top:14px;font-weight:700">${t("dTh")}</div>
  <button class="big sec" style="margin-top:14px" onclick="closeModal()">${t("cl")}</button></div>`;
  d.addEventListener("click",e=>{if(e.target===d)closeModal()});
  document.body.appendChild(d);
}
function heart(){return `<button class="heart" onclick="openDonate()" aria-label="Donate"><svg viewBox="0 0 32 30" width="31" height="29" aria-hidden="true"><defs><linearGradient id="hg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF176"/><stop offset=".45" stop-color="#FFC400"/><stop offset="1" stop-color="#E69500"/></linearGradient></defs><path d="M16 29 C16 29 1.5 19.5 1.5 10 C1.5 5 5.3 1.5 9.6 1.5 C12.4 1.5 14.7 3 16 5.4 C17.3 3 19.6 1.5 22.4 1.5 C26.7 1.5 30.5 5 30.5 10 C30.5 19.5 16 29 16 29 Z" fill="url(#hg)" stroke="#B8860B" stroke-width="1.6" stroke-linejoin="round"/></svg></button>`}
function topBar(back){return `<div class="top">${back?`<button class="back" onclick="home()">${t("home")}</button>`:langBtn()}<div class="tright"><div class="sz"><button onclick="fontSize(-2)" aria-label="${t("sm")}">A−</button><button onclick="fontSize(2)" aria-label="${t("bg")}">A+</button></div><button class="vbtn" onclick="openVoice()" aria-label="${t("voice")}">🗣️</button>${heart()}</div></div>`}
function spk(x){return `<button class="spk" onclick='say(${JSON.stringify(x).replace(/'/g,"&#39;")})' aria-label="${t("lis1")}">🔊</button>`}
function sayText(w){return w[3]||w[0]}

/* ---------- Αρχική ---------- */
function home(){
  stopSpeak();window.scrollTo(0,0);
  const n=Object.keys(S.done).length,nx=nextLesson();
  let h=topBar(false)+`<div class="card hero"><h1>${t("hero")}</h1><div class="small">${t("sub",n,LS.length)}</div><div class="prog"><i style="width:${n/LS.length*100}%"></i></div>`;
  if(nx>=0) h+=`<div class="small">${n?t("nxt"):t("first")}</div><h2 dir="auto">${LS[nx].ic} ${nx+1}. ${LT(nx)}</h2><button class="big go" onclick="lesson(${nx})">${t("start")}</button>`;
  else h+=`<h2>${t("alld")}</h2>`;
  h+=`</div>`;
  if(nx<0) h+=finaleCard();
  h+=`<div class="list">`;
  LS.forEach((L,i)=>{const d=S.done[i];h+=`<button class="row" onclick="lesson(${i})"><span class="num" style="background:${col(i)}">${L.ic}</span><span class="tt" dir="auto">${i+1}. ${LT(i)}</span><span class="st">${d!==undefined?"✅":(i===nx?"⭐":"")}</span></button>`});
  h+=`</div>`;
  if(nx>=0) h+=`<a class="big sec" style="margin-top:22px" href="index.html">${t("know")}</a>`;
  if(n) h+=`<button class="reset2" onclick="askReset()">${t("reset")}</button>`;
  app.innerHTML=h;
}
function finaleCard(){return `<div class="card finale"><div style="font-size:2.4em">🎓</div><h2>${t("finT")}</h2><div dir="auto">${t("finX")}</div><a class="big go" style="margin-top:16px" href="index.html">${t("finB")}</a></div>`}
function askReset(){
  const d=document.createElement("div");d.className="modal";d.id="modal";
  d.addEventListener("click",e=>{if(e.target===d)closeModal()});
  d.innerHTML=`<div class="box" dir="auto"><h2 style="color:var(--red)">${t("sure")}</h2><div>${t("sureX")}</div><button class="big go" onclick="S.done={};save();closeModal();home()">${t("yes")}</button><button class="big sec" onclick="closeModal()">${t("no")}</button></div>`;
  document.body.appendChild(d);
}

/* ---------- Μάθημα ---------- */
function lesson(i){
  stopSpeak();window.scrollTo(0,0);
  const L=LS[i];
  let h=topBar(true)+`<div class="card"><span class="tag" style="background:${col(i)}">${t("of",i+1,LS.length)}</span><h2 style="margin:10px 0 12px;line-height:1.3" dir="auto">${L.ic} ${LT(i)}</h2><div class="rule">${LR(i).split("<br>").map(x=>`<div dir="auto">${x}</div>`).join("")}</div></div>`;
  h+=`<button class="big blue" onclick="playAll(${i})">${t("all")}</button>`;
  h+=`<div class="list" style="margin-top:14px">`;
  L.w.forEach((w,k)=>{h+=`<div class="word"><div class="bx"><div class="en" lang="en" dir="ltr">${esc(w[0])}</div>${showPr()?`<div class="pr">«${esc(w[2])}»</div>`:""}<div class="gr" dir="auto">${esc(M(i,k))}</div></div>${spk(sayText(w))}</div>`});
  h+=`</div><button class="big go" style="margin-top:18px" onclick="startQuiz(${i})">${t("prac")}</button>`;
  h+=`<div class="nav">${i>0?`<button onclick="lesson(${i-1})">${t("les",i)}</button>`:""}${i<LS.length-1?`<button onclick="lesson(${i+1})">${t("les",i+2)}</button>`:""}</div>`;
  app.innerHTML=h;
}
function playAll(i){sayAll(LS[i].w.map(sayText))}

/* ---------- Εξάσκηση ---------- */
let Q=null;
function startQuiz(i){
  stopSpeak();
  const L=LS[i],picks=shuffle(L.w.map((w,k)=>k)).slice(0,8);
  const types=L.q==="listen"?["l"]:["eg","ge","l"];
  Q={li:i,items:shuffle(picks.map((k,n)=>({k,ty:types[n%types.length]}))),pos:0,score:0,res:[]};
  showQ();
}
function fieldOf(i,k,f){return f===1?M(i,k):LS[i].w[k][0]}
function opts(i,k,f){
  const n=LS[i].w.length,correct=fieldOf(i,k,f),out=[correct];
  for(const j of shuffle([...Array(n).keys()])){const v=fieldOf(i,j,f);if(!out.includes(v))out.push(v);if(out.length===3)break}
  return shuffle(out);
}
function showQ(){
  window.scrollTo(0,0);
  const it=Q.items[Q.pos],w=LS[Q.li].w[it.k],f=it.ty==="eg"?1:0;
  let h=topBar(true)+`<div class="card"><div class="qnum">${t("qh",Q.li+1,Q.pos+1,Q.items.length)}</div><div class="dots">`;
  Q.items.forEach((x,k)=>h+=`<i class="${k<Q.pos?(Q.res[k]?"g":"r"):(k===Q.pos?"c":"")}"></i>`);
  h+=`</div>`;
  if(it.ty==="eg") h+=`<div class="q en" lang="en" dir="ltr">${esc(w[0])} ${spk(sayText(w))}</div><div class="qh">${t("mean")}</div>`;
  else if(it.ty==="ge") h+=`<div class="q gr" dir="auto">${esc(M(Q.li,it.k))}</div><div class="qh">${t("how")}</div>`;
  else h+=`<button class="listen" onclick='say(${JSON.stringify(sayText(w)).replace(/'/g,"&#39;")})' aria-label="${t("lis1")}">🔊</button><div class="qh">${t("lis")}</div>`;
  opts(Q.li,it.k,f).forEach(o=>h+=`<button class="opt" ${f===0?'lang="en" dir="ltr"':'dir="auto"'} data-o="${encodeURIComponent(o)}" onclick="answer(this)">${esc(o)}</button>`);
  app.innerHTML=h+`<div id="fb"></div></div>`;
  if(it.ty==="l") setTimeout(()=>say(sayText(w)),300);
}
function answer(btn){
  const it=Q.items[Q.pos],w=LS[Q.li].w[it.k],f=it.ty==="eg"?1:0,correct=fieldOf(Q.li,it.k,f);
  const ok=decodeURIComponent(btn.dataset.o)===correct;
  document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(decodeURIComponent(b.dataset.o)===correct)b.classList.add("right")});
  if(!ok)btn.classList.add("wrong");
  Q.res[Q.pos]=ok;if(ok)Q.score++;
  const last=Q.pos===Q.items.length-1;
  document.getElementById("fb").innerHTML=`<div class="fb ${ok?"g":"r"}"><div dir="auto">${ok?t("ok"):t("bad")}</div><div class="rowb">${spk(sayText(w))}<span dir="auto"><b lang="en">${esc(w[0])}</b>${showPr()?` «${esc(w[2])}»`:""} = ${esc(M(Q.li,it.k))}</span></div></div><button class="big go" style="margin-top:16px" onclick="nextQ()">${last?t("fin"):t("next")}</button>`;
  document.getElementById("fb").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function nextQ(){Q.pos++;if(Q.pos<Q.items.length)showQ();else finish()}
function finish(){
  stopSpeak();window.scrollTo(0,0);
  const tot=Q.items.length,sc=Q.score,i=Q.li;
  const p=S.done[i];S.done[i]=p===undefined?sc:Math.max(p,sc);save();
  const st=sc>=tot?3:(sc>=tot-2?2:1);
  const msg=sc===tot?t("p3"):(sc>=tot-2?t("p2"):t("p1"));
  let h=topBar(true)+`<div class="card center"><div class="stars">${"⭐".repeat(st)}${"☆".repeat(3-st)}</div><h2 style="margin:4px 0" dir="auto">${msg}</h2><div style="font-size:1.1em">${t("score",sc,tot)}</div></div>`;
  if(i<LS.length-1) h+=`<button class="big go" onclick="lesson(${i+1})" dir="auto">${t("nl")} ${LS[i+1].ic} ${LT(i+1)}</button>`;
  else h+=finaleCard();
  h+=`<div class="nav"><button onclick="startQuiz(${i})">${t("aq")}</button><button onclick="lesson(${i})">${t("al")}</button></div><div class="nav"><button onclick="home()">${t("hb")}</button></div>`;
  app.innerHTML=h;
}

/* ---------- Έναρξη ---------- */
(function(){
  let l=getLang();
  if(!l){try{const a=JSON.parse(localStorage.getItem("agglika5_v1")||"{}"),b=JSON.parse(localStorage.getItem("lexilogio_v1")||"{}");if((a.done&&Object.keys(a.done).length)||(b.w&&Object.keys(b.w).length)){l="el";setLang("el")}}catch(e){}}
  if(!l){chrome();pickLang();return}
  if(!LANG_ALL.some(x=>x[0]===l))l="el";
  loadPack(l,home);
})();
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){navigator.serviceWorker.register("sw.js").catch(()=>{})}

</script>
