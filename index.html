{t:"Το -s στο he / she / it",
r:"Στον Ενεστώτα (Present Simple), όταν μιλάμε για <b>ένα τρίτο πρόσωπο</b> (he, she, it, my wife, the doctor), το ρήμα παίρνει <b>-s</b>.<br>Μετά από -sh, -ch, -o, -x βάζουμε <b>-es</b>: watches, goes.<br>Το have γίνεται <b>has</b>.",
e:[[0,"My wife like music."],[1,"My wife likes music."],[1,"He watches TV every evening."],[1,"She has two children."]],

["She ___ to church on Sundays.","goes","go","gos","go → goes (μετά από -o βάζουμε -es)."],
["My friends ___ coffee every morning.","drink","drinks","drinking","My friends = they, άρα χωρίς -s."],
["He ___ a big house.","has","have","haves","Για he / she / it το have γίνεται has."],
["Ποια πρόταση είναι σωστή;","The shop opens at nine.","The shop open at nine.","The shop opening at nine.","The shop = it, άρα opens."],
["The doctor ___ English very well.","speaks","speak","is speak","The doctor = he/she, άρα speaks."]]},

{t:"Ερωτήσεις και αρνήσεις με do / does",

["She doesn't ___ meat.","eat","eats","eating","Μετά το doesn't το ρήμα μένει γυμνό."],
["___ your children live in Cyprus?","Do","Does","Are","your children = they, άρα Do."],
["I ___ understand this word.","don't","doesn't","not","I → don't."],
["Ποια ερώτηση είναι σωστή;","Where does he work?","Where he works?","Where does he works?","Χρειάζεται does, και το work μένει γυμνό."],
["My wife ___ like loud music.","doesn't","don't","isn't","My wife = she, άρα doesn't."]]},

{t:"Τώρα ή συνήθως; (-ing)",

["I ___ to the market every Saturday.","go","am going","going","every Saturday = συνήθεια, άρα go."],

["I ___ what you mean.","understand","am understanding","understanding","Το understand δεν παίρνει -ing."],
["What ___ you doing now?","are","do","is","now → are you doing."],

{t:"«Είμαι» αντί για «έχω»",

{t:"a / an — «ένας, μία»",

q:[["___ love is important.","-","The","A","Γενικά (η αγάπη γενικά), χωρίς άρθρο."],
["We had ___ breakfast at eight.","-","the","a","Τα γεύματα χωρίς άρθρο."],
["___ Cyprus is a beautiful island.","-","The","A","Οι χώρες χωρίς the."],
["Can you close ___ door, please?","the","-","an","Συγκεκριμένη πόρτα, άρα the."],
["Μου αρέσει η μουσική.","I like music.","I like the music.","I like a music.","Γενικά η μουσική, χωρίς the."],
["___ moon is very bright tonight.","The","-","A","Υπάρχει μόνο ένα φεγγάρι, άρα the."]]},

{t:"Παρελθόν: -ed",
r:"Για κάτι που έγινε και <b>τελείωσε</b> (yesterday, last week, in 1990) χρησιμοποιούμε τον Αόριστο (Past Simple).<br>Στα κανονικά ρήματα βάζουμε <b>-ed</b>: work → worked.<br>Ίδιο για όλα τα πρόσωπα.<br>live → lived, stop → stopped, study → studied.",
e:[[0,"Yesterday I work in the garden."],[1,"Yesterday I worked in the garden."],[1,"She lived in Athens in 1980."],[1,"We studied together."]],
q:[["Last night we ___ a film.","watched","watch","watching","last night = παρελθόν, άρα watched."],
["He ___ in a bank for 30 years. Now he is retired.","worked","works","working","Τώρα είναι συνταξιούχος, άρα παρελθόν: worked."],
["She ___ me yesterday.","called","call","calls","yesterday → called."],
["I ___ English at school.","studied","studyed","study","study → studied (το y γίνεται i)."],
["Το λεωφορείο σταμάτησε.","The bus stopped.","The bus stoped.","The bus stop.","stop → stopped (διπλό p)."],
["They ___ to Canada in 1975.","moved","move","moving","in 1975 → moved."]]},

{t:"Παρελθόν: ανώμαλα ρήματα",
r:"Πολλά συχνά ρήματα δεν παίρνουν -ed, αλλάζουν:<br>go → <b>went</b>, see → <b>saw</b>, eat → <b>ate</b>, buy → <b>bought</b>, come → <b>came</b>, take → <b>took</b>, say → <b>said</b>, make → <b>made</b>, have → <b>had</b>, get → <b>got</b>, think → <b>thought</b>, be → <b>was / were</b>.",
e:[[0,"I goed to the doctor."],[1,"I went to the doctor."],[0,"We buyed bread."],[1,"We bought bread."],[1,"They were at home."]],
q:[["Yesterday I ___ my friend at the market.","saw","seed","see","see → saw."],
["We ___ fish last night.","ate","eated","eat","eat → ate."],
["She ___ a new phone last week.","bought","buyed","buy","buy → bought."],
["I ___ tired yesterday.","was","were","am","I → was."],
["Χθες πήγαμε στη θάλασσα.","Yesterday we went to the sea.","Yesterday we goed to the sea.","Yesterday we go to the sea.","go → went."],
["My children ___ to visit me last Sunday.","came","comed","come","come → came."]]},

{t:"Ερωτήσεις στο παρελθόν: did",
r:"Στο παρελθόν, για ερώτηση και άρνηση βάζουμε <b>did / didn't</b> για όλα τα πρόσωπα.<br>Το παρελθόν «πάει» στο did, άρα το ρήμα μένει <b>γυμνό</b>: Did you <b>go</b>? (όχι went).<br>Εξαίρεση το was / were: Were you at home? I wasn't there.",
e:[[0,"Did you went to the shop?"],[1,"Did you go to the shop?"],[0,"I didn't saw him."],[1,"I didn't see him."]],
q:[["Did she ___ you yesterday?","call","called","calls","Μετά το did το ρήμα μένει γυμνό."],
["I didn't ___ anything.","buy","bought","buyed","Μετά το didn't: buy, όχι bought."],
["___ you sleep well last night?","Did","Do","Were","last night + ρήμα sleep → Did."],
["___ you at home yesterday?","Were","Did","Was","Με το be: Were you...?"],
["Πού πήγες χθες;","Where did you go yesterday?","Where did you went yesterday?","Where you went yesterday?","did + γυμνό ρήμα: did you go."],
["He ___ come to the party.","didn't","don't","wasn't","Παρελθόν άρνηση: didn't come."]]},

{t:"«Μένω εδώ 20 χρόνια» (Present Perfect)",
r:"<b>have / has + 3η μορφή</b> (been, done, seen, lived, known).<br>Το χρησιμοποιούμε όταν κάτι <b>ξεκίνησε στο παρελθόν και συνεχίζει ως σήμερα</b>, ή για εμπειρίες χωρίς συγκεκριμένο χρόνο.<br>«Μένω εδώ 20 χρόνια» = I <b>have lived</b> here for 20 years.<br>Με ever, never, already, just.",
e:[[0,"I live here for 20 years."],[1,"I have lived here for 20 years."],[0,"I am married since 1978."],[1,"I have been married since 1978."],[1,"Have you ever been to London?"]],
q:[["I ___ this doctor for ten years.","have known","know","am knowing","Συνεχίζει ως σήμερα, άρα have known."],
["She ___ never seen snow.","has","have","is","she → has seen."],
["___ you ever eaten sushi?","Have","Did","Are","ever → Have you ever...?"],
["We ___ married for 45 years.","have been","are","were","Από τότε ως σήμερα: have been."],
["Έχω ήδη φάει.","I have already eaten.","I have already ate.","I already eat.","have + 3η μορφή: eaten."],
["They have just ___ home.","arrived","arrive","arriving","have + 3η μορφή: arrived."]]},

{t:"for, since, ago",
r:"<b>for</b> + διάρκεια: for 3 years, for two hours.<br><b>since</b> + σημείο έναρξης: since 1990, since Monday.<br><b>ago</b> = «πριν», μπαίνει <b>μετά</b> τον χρόνο, με Αόριστο: two years ago.",
e:[[0,"I came to Cyprus before ten years."],[1,"I came to Cyprus ten years ago."],[0,"I have lived here since 20 years."],[1,"I have lived here for 20 years."],[1,"I have lived here since 2006."]],
q:[["I have worked here ___ 1995.","since","for","ago","1995 = σημείο έναρξης, άρα since."],
["She has been ill ___ three days.","for","since","ago","three days = διάρκεια, άρα for."],
["We met forty years ___.","ago","before","since","«πριν από 40 χρόνια» = forty years ago."],
["He has waited ___ two hours.","for","since","ago","two hours = διάρκεια, άρα for."],
["Τον είδα πριν από μία εβδομάδα.","I saw him a week ago.","I saw him before a week.","I have seen him a week ago.","Με ago βάζουμε Αόριστο: saw."],
["I haven't seen her ___ Christmas.","since","for","ago","Christmas = σημείο έναρξης, άρα since."]]},

{t:"Μέλλοντας: will και going to",
r:"<b>will + γυμνό ρήμα</b>: απόφαση <b>τη στιγμή</b> που μιλάμε, υπόσχεση, πρόβλεψη: I'll help you.<br><b>going to + γυμνό ρήμα</b>: <b>σχέδιο</b> που έχουμε ήδη αποφασίσει: I'm going to visit my son next month.<br>Μετά το will <b>ποτέ</b> to.",
e:[[0,"I will to call you."],[1,"I will call you."],[1,"We are going to travel in May."],[1,"The phone is ringing. I'll answer it."]],
q:[["I will ___ you tomorrow.","see","to see","seeing","Μετά το will: γυμνό ρήμα."],
["We ___ going to buy a new car next year.","are","will","do","we are going to..."],
["Wait, I ___ open the door for you.","will","am going","going","Απόφαση τη στιγμή που μιλάμε: will."],
["She is going ___ cook tonight.","to","-","will","going to + ρήμα."],
["Θα σε βοηθήσω.","I will help you.","I will to help you.","I will helping you.","will + γυμνό ρήμα."],
["Look at those clouds! It ___ rain.","is going to","going to","will to","Το βλέπουμε να έρχεται: is going to."]]},

{t:"Πληθυντικός και αμέτρητα",
r:"Συνήθως +<b>s</b>: book → books.<br>Ανώμαλα: person → <b>people</b>, child → <b>children</b>, man → <b>men</b>, woman → <b>women</b>, tooth → <b>teeth</b>.<br>Δεν έχουν πληθυντικό και δεν παίρνουν a: <b>information, advice, news, furniture, money, bread</b>.<br>Το <b>people</b> είναι πάντα πληθυντικός: people <b>are</b>.",
e:[[0,"Can you give me an advice?"],[1,"Can you give me some advice?"],[0,"The people is friendly."],[1,"The people are friendly."],[1,"I have three children."]],
q:[["I need some ___.","information","informations","an information","Το information δεν έχει πληθυντικό."],
["There are many ___ in the playground.","children","childs","childrens","child → children."],
["The news ___ good today.","is","are","were","Το news είναι ενικός: is."],
["Those people ___ my neighbours.","are","is","was","people = πληθυντικός: are."],
["Σου έδωσα μια καλή συμβουλή.","I gave you some good advice.","I gave you a good advice.","I gave you good advices.","Το advice δεν παίρνει a ούτε -s."],
["I brush my ___ twice a day.","teeth","tooths","tooth","tooth → teeth."]]},

{t:"much, many, a lot of",
r:"<b>many</b> με μετρήσιμα στον πληθυντικό: many friends.<br><b>much</b> με αμέτρητα: much time, much money (κυρίως σε ερωτήσεις και αρνήσεις).<br><b>a lot of</b> ταιριάζει και στα δύο.<br>How <b>many</b> children? How <b>much</b> money?",
e:[[0,"I don't have many time."],[1,"I don't have much time."],[0,"How much brothers do you have?"],[1,"How many brothers do you have?"],[1,"She has a lot of friends."]],
q:[["How ___ grandchildren do you have?","many","much","lot","grandchildren μετριούνται: many."],
["I don't drink ___ coffee.","much","many","a lot","coffee δεν μετριέται: much."],
["There were ___ cars on the road.","a lot of","much","a lot","a lot of + ουσιαστικό."],
["How ___ does this cost?","much","many","lot","Για τιμή: How much?"],
["Δεν έχουμε πολλά λεφτά.","We don't have much money.","We don't have many money.","We don't have many moneys.","money δεν μετριέται: much."],
["She reads ___ books.","many","much","a lot","books μετριούνται: many."]]},

{t:"some ή any;",
r:"<b>some</b> σε καταφατικές προτάσεις: I have some bread.<br><b>any</b> σε <b>ερωτήσεις</b> και <b>αρνήσεις</b>: Do you have any bread? I don't have any bread.<br>Σε ευγενική προσφορά ή παράκληση λέμε <b>some</b>: Would you like some tea?",
e:[[0,"I don't have some money."],[1,"I don't have any money."],[1,"Are there any eggs?"],[1,"Would you like some cake?"]],
q:[["There isn't ___ milk in the fridge.","any","some","no","Άρνηση: any."],
["I bought ___ apples.","some","any","a","Καταφατική: some."],
["Do you have ___ questions?","any","a","much","Ερώτηση: any."],
["Would you like ___ coffee?","some","any","a few","Ευγενική προσφορά: some."],
["Δεν έχω φίλους εδώ.","I don't have any friends here.","I don't have some friends here.","I have any friends here.","Άρνηση: don't have any."],
["Can I have ___ water, please?","some","any","many","Ευγενική παράκληση: some."]]},

{t:"in, on, at — για τον χρόνο",
r:"<b>at</b> για ώρα: at 8 o'clock, at night.<br><b>on</b> για ημέρα και ημερομηνία: on Monday, on 5 May, on my birthday.<br><b>in</b> για μήνα, χρόνο, εποχή, μέρος της ημέρας: in May, in 1954, in summer, in the morning.<br><b>Χωρίς</b> πρόθεση: today, tomorrow, yesterday, next week, last year.",
e:[[0,"I was born on 1954."],[1,"I was born in 1954."],[0,"See you in Monday."],[1,"See you on Monday."],[0,"I'll call you at tomorrow."],[1,"I'll call you tomorrow."]],
q:[["The shop opens ___ 9 o'clock.","at","on","in","Ώρα: at."],
["My birthday is ___ March.","in","on","at","Μήνας: in."],
["We go to church ___ Sunday.","on","in","at","Ημέρα: on."],
["I drink coffee ___ the morning.","in","on","at","in the morning."],
["Θα σε δω την επόμενη εβδομάδα.","I will see you next week.","I will see you in next week.","I will see you on next week.","Με next δεν βάζουμε πρόθεση."],
["He was born ___ 12 June 1980.","on","in","at","Ημερομηνία: on."]]},

{t:"in, on, at — για τον τόπο",
r:"<b>in</b> = μέσα: in the room, in the car, in Cyprus.<br><b>on</b> = πάνω σε επιφάνεια: on the table, on the wall.<br><b>at</b> = σε ένα σημείο: at home, at work, at the door.<br>Πηγαίνω: go <b>to</b> work, αλλά go <b>home</b> (χωρίς to).",
e:[[0,"I live at Limassol."],[1,"I live in Limassol."],[0,"I am going to home."],[1,"I am going home."],[1,"The keys are on the table."]],
q:[["My wife is ___ home.","at","in","on","Λέμε at home."],
["The picture is ___ the wall.","on","in","at","Πάνω στον τοίχο: on."],
["We live ___ Larnaca.","in","at","on","Πόλη: in."],
["Someone is ___ the door.","at","in","on","Σημείο: at the door."],
["Πάω σπίτι.","I'm going home.","I'm going to home.","I'm going at home.","go home, χωρίς to."],
["The milk is ___ the fridge.","in","on","at","Μέσα στο ψυγείο: in."]]},

{t:"his ή her; (κτητικά)",
r:"<b>his</b> = του (για άνδρα), <b>her</b> = της (για γυναίκα), <b>its</b> = του (για πράγμα ή ζώο), <b>their</b> = τους.<br>Επίσης: my, your, our.<br>Κοιτάμε <b>ποιος έχει</b> το πράγμα, όχι το πράγμα.<br>Προσοχή: <b>its</b> (του) ≠ <b>it's</b> (= it is).",
e:[[0,"My sister and his husband."],[1,"My sister and her husband."],[1,"My brother and his wife."],[0,"The dog wants it's food."],[1,"The dog wants its food."]],
q:[["Maria lost ___ keys.","her","his","their","Maria = γυναίκα: her."],
["George loves ___ grandchildren.","his","her","its","George = άνδρας: his."],
["My parents sold ___ house.","their","there","his","parents = they: their."],
["The dog is eating ___ dinner.","its","it's","their","Για ζώο: its (it's = it is)."],
["Η γυναίκα μου και ο αδελφός της.","My wife and her brother.","My wife and his brother.","My wife and she brother.","«της» = her."],
["We love ___ new home.","our","us","we","we → our."]]},

{t:"I ή me; he ή him;",
r:"<b>Πριν</b> από το ρήμα: <b>I, he, she, we, they</b>.<br><b>Μετά</b> το ρήμα ή μετά από πρόθεση (to, with, for): <b>me, him, her, us, them</b>.<br>He loves <b>her</b>. Come <b>with me</b>.",
e:[[0,"Me and my wife went."],[1,"My wife and I went."],[0,"Give it to I."],[1,"Give it to me."],[1,"I called him."]],
q:[["Can you help ___?","me","I","my","Μετά το ρήμα: me."],
["___ are my best friends.","They","Them","Their","Πριν από το ρήμα: They."],
["I gave the book to ___.","her","she","hers","Μετά το to: her."],
["Come with ___!","us","we","our","Μετά το with: us."],
["Τον ξέρω πολύ καλά.","I know him very well.","I know he very well.","I know his very well.","Μετά το ρήμα: him."],
["My son and ___ went fishing.","I","me","my","Πριν από το ρήμα: My son and I."]]},

{t:"Επίθετα: πριν το ουσιαστικό",
r:"Το επίθετο μπαίνει <b>πριν</b> από το ουσιαστικό: a <b>red</b> car (όχι a car red).<br>Και <b>δεν</b> αλλάζει ποτέ: δεν παίρνει -s, δεν έχει γένος.<br>beautiful house<b>s</b>, old men, old women.",
e:[[0,"I have two olds cars."],[1,"I have two old cars."],[0,"a house big"],[1,"a big house"],[1,"They are very kind people."]],
q:[["She has ___.","beautiful eyes","eyes beautiful","beautifuls eyes","Επίθετο πριν, χωρίς -s."],
["We bought ___.","a new car","a car new","an new car","Επίθετο πριν από το ουσιαστικό."],
["These are ___ shoes.","expensive","expensives","expensiver","Το επίθετο δεν παίρνει -s."],
["Είναι καλοί άνθρωποι.","They are good people.","They are goods people.","They are people good.","good πριν, χωρίς -s."],
["I live in a ___.","small house","house small","smalls house","Επίθετο πριν από το ουσιαστικό."],
["My grandchildren are very ___.","clever","clevers","clevered","Το επίθετο δεν αλλάζει."]]},

{t:"Συγκρίσεις: bigger, more beautiful",
r:"Μικρά επίθετα: <b>-er + than</b>: older than, bigger than.<br>Μεγάλα επίθετα: <b>more ... than</b>: more beautiful than.<br>Σε -y: happy → happier.<br>Ανώμαλα: good → <b>better</b>, bad → <b>worse</b>.<br>Υπερθετικός: the biggest, the most beautiful, the best.<br>Ποτέ «more bigger».",
e:[[0,"He is more old than me."],[1,"He is older than me."],[0,"This is more better."],[1,"This is better."],[1,"It is the most beautiful place."]],
q:[["My brother is ___ than me.","older","more old","oldest","Μικρό επίθετο: older than."],
["This book is ___ than that one.","more interesting","interestinger","most interesting","Μεγάλο επίθετο: more interesting."],
["Today is ___ than yesterday.","better","more good","gooder","good → better."],
["Everest is ___ mountain in the world.","the highest","the most high","higher","Υπερθετικός: the highest."],
["Η Λευκωσία είναι μεγαλύτερη από τη Λάρνακα.","Nicosia is bigger than Larnaca.","Nicosia is more big than Larnaca.","Nicosia is bigger from Larnaca.","bigger than (όχι from)."],
["My car is ___ than yours.","cheaper","more cheap","cheapest","Μικρό επίθετο: cheaper."]]},

{t:"good ή well;",
r:"<b>good</b> = επίθετο, περιγράφει πρόσωπο ή πράγμα: a good cook, the food is good.<br><b>well</b> = επίρρημα, περιγράφει <b>πώς</b> κάνουμε κάτι: She cooks well.<br>Τα επιρρήματα συνήθως παίρνουν <b>-ly</b>: slowly, carefully, quickly.",
e:[[0,"She sings very good."],[1,"She sings very well."],[0,"Drive careful!"],[1,"Drive carefully!"],[1,"This is a good song."]],
q:[["He plays the guitar very ___.","well","good","goodly","Πώς παίζει; well."],
["This soup is very ___.","good","well","goodly","Περιγράφει τη σούπα: good."],
["Please speak ___.","slowly","slow","slowely","Πώς να μιλήσει; slowly."],
["She did the work ___.","carefully","careful","carefuly","Πώς το έκανε; carefully."],
["Μιλάς καλά ελληνικά.","You speak Greek well.","You speak Greek good.","You well speak Greek.","Πώς μιλάς; well, στο τέλος."],
["He is a ___ driver.","good","well","goodly","Περιγράφει τον οδηγό: good."]]},

{t:"Η σειρά των λέξεων",
r:"Η σειρά είναι σταθερή: <b>Ποιος → Ρήμα → Τι → Πώς → Πού → Πότε</b>.<br>Το «πολύ» (very much) μπαίνει <b>στο τέλος</b>: I like music very much.<br>always, often, never μπαίνουν <b>πριν</b> από το ρήμα, αλλά <b>μετά</b> από το am/is/are: I always drink tea. She is always late.",
e:[[0,"I like very much the sea."],[1,"I like the sea very much."],[0,"I drink always coffee."],[1,"I always drink coffee."],[1,"He is never late."]],
q:[["Ποια είναι σωστή;","I love my grandchildren very much.","I love very much my grandchildren.","Very much I love my grandchildren.","very much στο τέλος."],
["She ___ tea in the morning.","usually drinks","drinks usually","usually drink","usually πριν από το ρήμα, και drinks με -s."],
["He ___ late.","is never","never is","never be","never μετά από το is."],
["Ποια είναι σωστή;","We went to the beach yesterday.","We went yesterday to the beach.","Yesterday went we to the beach.","Πού πριν από το πότε."],
["Δεν τρώω ποτέ κρέας.","I never eat meat.","I don't eat never meat.","I eat never meat.","never πριν από το ρήμα, χωρίς don't."],
["I ___ my wife in the kitchen.","often help","help often","often helps","often πριν από το ρήμα· I χωρίς -s."]]},

{t:"There is / There are — «υπάρχει, έχει»",
r:"Στα ελληνικά λέμε «<i>έχει</i> πολύ κόσμο», «<i>υπάρχει</i> ένα καφενείο».<br>Στα αγγλικά: <b>There is</b> + ενικός, <b>There are</b> + πληθυντικός.<br>Παρελθόν: There was / There were.<br>Ερώτηση: Is there...? Are there...?",
e:[[0,"It has a café near my house."],[1,"There is a café near my house."],[0,"Has many people here."],[1,"There are many people here."],[1,"Is there a pharmacy near here?"]],
q:[["___ a bank on this street.","There is","There are","It has","Ενικός: There is."],
["___ two bedrooms in my house.","There are","There is","It has","Πληθυντικός: There are."],
["___ a lot of traffic yesterday.","There was","There were","It had","traffic = ενικός, παρελθόν: There was."],
["___ any shops near here?","Are there","Is there","Have","shops = πληθυντικός: Are there."],
["Έχει πολύ κόσμο στην παραλία.","There are many people on the beach.","It has many people on the beach.","There is many people on the beach.","people = πληθυντικός: There are."],
["___ a problem with my phone.","There is","There are","It has","Ενικός: There is."]]},

{t:"can, must, should",
r:"Μετά από <b>can, could, must, should, will</b> το ρήμα μένει <b>γυμνό</b>: χωρίς to, χωρίς -s.<br>She can <b>swim</b> (όχι can to swim, όχι cans).<br><b>can</b> = μπορώ · <b>must / have to</b> = πρέπει · <b>should</b> = καλό θα ήταν.<br>Ερώτηση: Can you...? Should I...?",
e:[[0,"He cans speak English."],[1,"He can speak English."],[0,"You must to rest."],[1,"You must rest."],[1,"You should see a doctor."]],
q:[["She can ___ very well.","cook","to cook","cooks","Μετά το can: γυμνό ρήμα."],
["You ___ take your medicine every day.","must","musts","must to","must χωρίς -s και χωρίς to."],
["He ___ to get up early tomorrow.","has","must","should","has to = πρέπει (εδώ υπάρχει το to)."],
["You look tired. You ___ rest.","should","should to","shoulds","should + γυμνό ρήμα."],
["Μπορείς να με βοηθήσεις;","Can you help me?","Can you to help me?","Do you can help me?","Can you + γυμνό ρήμα."],
["I ___ swim when I was young.","could","can","could to","Παρελθόν του can: could."]]},

{t:"Ερωτήσεις: What, Where, When...",
r:"Ερωτηματική λέξη + <b>βοηθητικό</b> (do / does / did / is / are) + ποιος + ρήμα.<br>Where <b>do</b> you live? What <b>did</b> he say?<br>Στα ελληνικά δεν χρειάζεται («Πού μένεις;»), γι' αυτό συχνά το ξεχνάμε.",
e:[[0,"Where you live?"],[1,"Where do you live?"],[0,"What you want?"],[1,"What do you want?"],[0,"Why you didn't come?"],[1,"Why didn't you come?"]],
q:[["Where ___ your daughter work?","does","do","is","your daughter = she: does."],

const LANG_ALL=[["el", "🇬🇷", "Ελληνικά", "Εξηγήσεις στα ελληνικά"], ["en", "🌍", "English (simple)", "Easy English explanations — for every nationality"], ["ar", "ع", "العربية", "الشرح باللغة العربية"], ["tr", "🇹🇷", "Türkçe", "Türkçe açıklamalar"], ["vi", "🇻🇳", "Tiếng Việt", "Giải thích bằng tiếng Việt"], ["ru", "🇷🇺", "Русский", "Объяснения на русском"], ["ro", "🇷🇴", "Română", "Explicații în limba română"], ["fr", "🇫🇷", "Français", "Explications en français"], ["uk", "🇺🇦", "Українська", "Пояснення українською"], ["bg", "🇧🇬", "Български", "Обяснения на български"], ["fil", "🇵🇭", "Filipino", "Paliwanag sa Filipino (Tagalog)"], ["si", "🇱🇰", "සිංහල", "සිංහලෙන් පැහැදිලි කිරීම්"], ["ne", "🇳🇵", "नेपाली", "नेपालीमा व्याख्या"], ["hi", "🇮🇳", "हिन्दी", "हिन्दी में व्याख्या"], ["es", "🇪🇸", "Español", "Explicaciones en español"], ["pt", "🇧🇷", "Português", "Explicações em português"], ["de", "🇩🇪", "Deutsch", "Erklärungen auf Deutsch"], ["it", "🇮🇹", "Italiano", "Spiegazioni in italiano"], ["pl", "🇵🇱", "Polski", "Wyjaśnienia po polsku"], ["fa", "ف", "فارسی", "توضیحات به فارسی"], ["ur", "ا", "اردو", "اردو میں وضاحت"], ["bn", "🇧🇩", "বাংলা", "বাংলায় ব্যাখ্যা"], ["zh", "🇨🇳", "中文", "中文讲解"], ["id", "🇮🇩", "Bahasa Indonesia", "Penjelasan dalam bahasa Indonesia"], ["he", "א", "עברית", "הסברים בעברית"], ["ja", "🇯🇵", "日本語", "日本語の説明"], ["ko", "🇰🇷", "한국어", "한국어 설명"]];
const COLORS=["#1f5fbf","#d9480f","#178a3e","#7b3fc4","#c2185b","#00838f"];
const KEY="agglika5_v1";
const app=document.getElementById("app");
let S=load();
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.done)return s}catch(e){}return{done:{},mist:[],last:"",fs:22}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function today(){const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function col(i){return COLORS[i%COLORS.length]}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
const UI_NEW={irregBtn:["📋 Ανώμαλα ρήματα και εξαιρέσεις","📋 Irregular verbs & exceptions"]};
function t(k,...a){let s=(PACK&&PACK.ui&&PACK.ui[k]!=null)?PACK.ui[k]:UI_NEW[k]?UI_NEW[k][PACK?1:0]:UI_EL[k];a.forEach((v,i)=>{s=s.split("{"+i+"}").join(v)});return s}
document.documentElement.style.setProperty("--fs",(S.fs||22)+"px");

/* ---------- Ήχος (αγγλική φωνή) ---------- */
let voice=null;
function pickVoice(){const vs=speechSynthesis.getVoices();voice=vs.find(v=>/en[-_]GB/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(x){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(x);u.lang="en-GB";if(voice)u.voice=voice;u.rate=.85;speechSynthesis.speak(u)}
function spkBtn(x){if(/[^\x00-ɏ‘-”–—…€£]/.test(x))return "";return `<button class="spk" onclick='say(${JSON.stringify(x).replace(/'/g,"&#39;")})' aria-label="${t("listen")}">🔊</button>`}

function toast(m){const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function fontSize(d){S.fs=Math.max(18,Math.min(30,(S.fs||22)+d));document.documentElement.style.setProperty("--fs",S.fs+"px");save()}
function nextLesson(){for(let i=0;i<LESSONS.length;i++)if(!(i in S.done))return i;return -1}
function topBar(back){return `<div class="top">${back?`<button class="back" onclick="home()">${t("home")}</button>`:langBtn()}<div class="tright"><div class="sz"><button onclick="fontSize(-2)" aria-label="${t("smaller")}">A−</button><button onclick="fontSize(2)" aria-label="${t("bigger")}">A+</button></div>${donateBtn()}</div></div>`}
function applyLangChrome(){
  if(!window.T0)window.T0=document.title;document.title=PACK?t("appTitle"):window.T0;
  const i=document.getElementById("intro"),v=document.getElementById("ver");
  if(i)i.textContent=t("intro");if(v)v.textContent=t("version","16-10-2026 09:57");
}

/* ---------- Αρχική ---------- */
function home(){
  window.scrollTo(0,0);applyLangChrome();
  const n=Object.keys(S.done).length, nx=nextLesson(), doneToday=S.last===today();
  let h=topBar(false);
  h+=`<div class="card hero"><h1>${t("appTitle")}</h1><div class="small">${t("progress",n,LESSONS.length)}</div><div class="prog"><i style="width:${n/LESSONS.length*100}%"></i></div>`;
  if(doneToday) h+=`<div class="done-msg">${t("doneToday")}</div>`;
  if(nx>=0){
    h+=`<div class="small">${doneToday?t("alsoNext"):t("todays")}</div><h2>${t("lessonN",nx+1)}: ${tr(LESSONS[nx].t)}</h2><button class="big go" onclick="lesson(${nx})">${t("start")}</button>`;
  } else h+=`<h2>${t("allDone",LESSONS.length)}</h2><div class="small">${t("keepReviewing")}</div>`;
  h+=`</div>`;
  if(S.cur!==undefined&&S.cur!==nx&&LESSONS[S.cur]) h+=`<button class="big sec" onclick="lesson(${S.cur})">${t("continueN",S.cur+1)}</button>`;
  const m=S.mist.length, sp=s=>{const k=s.search(/\s/);return k>0?`<span class="ti">${s.slice(0,k)}</span><span>${s.slice(k+1)}</span>`:s};
  h+=`<div class="grid2"><button class="tile" onclick="daily()">${sp(t("daily"))}</button><a class="tile" href="lexilogio.html" style="background:#0b7a6b;border-color:#0b7a6b;color:#fff;box-shadow:0 3px 0 #075247">${sp(t("vocabBtn"))}</a>`;
  h+=`<a class="tile full" href="anomala.html">${sp(t("irregBtn"))}</a>`;
  if(m) h+=`<button class="tile full" onclick="review()">${sp(t("reviewMist",m))}</button>`;
  h+=`</div>`;
  h+=`<h3 style="margin:18px 4px 6px">${t("allLessons",LESSONS.length)}</h3>`;
  [[0,30,"lv1"],[30,75,"lv2"],[75,120,"lv3"]].forEach(([a,b,nm])=>{
    const dn=Object.keys(S.done).filter(k=>k>=a&&k<b).length;
    h+=`<details class="lvl"><summary>${t(nm)} <span class="st">${a+1}–${b} · ${dn}/${b-a} ✅</span></summary><div class="list">`;
    for(let i=a;i<b;i++){const L=LESSONS[i],d=S.done[i];h+=`<button class="row" onclick="lesson(${i})"><span class="num" style="background:${col(i)}">${i+1}</span><span class="tt" dir="auto">${tr(L.t)}</span><span class="st">${d!==undefined?"✅ "+Math.min(d,6)+"/6":(i===nx?"⭐":"")}</span></button>`}
    h+=`</div></details>`;
  });
  h+=`<button class="reset2" onclick="askReset()">${t("reset")}</button>`;
  app.innerHTML=h;
}

/* ---------- Κανόνας ---------- */
function lesson(i){
  window.scrollTo(0,0);
  const L=LESSONS[i];
  S.cur=i;save();
  let h=topBar(true);
  h+=`<div class="card"><span class="tag" style="background:${col(i)}">${t("lessonN",i+1)}</span><h2 style="margin:10px 0 12px;line-height:1.3" dir="auto">${tr(L.t)}</h2><div class="rule">${tr(L.r).split("<br>").map(x=>`<div dir="auto">${x}</div>`).join("")}</div></div>`;
  h+=`<div class="card"><div style="font-weight:800;margin-bottom:6px">${t("examples")}</div>`;
  L.e.forEach(([ok,x])=>{const s=tr(x);h+= ok?`<div class="ex ok"><span class="ic">✅</span><span class="tx" dir="auto">${esc(s)}</span>${spkBtn(x)}</div>`:`<div class="ex no"><span class="ic">❌</span><span class="tx" dir="auto">${esc(s)}</span></div>`});
  h+=`</div><button class="big go" onclick="startQuiz(${i})">${t("practice")}</button>`;
  h+=`<div class="nav">${i>0?`<button onclick="lesson(${i-1})">${t("prevN",i)}</button>`:""}${i<LESSONS.length-1?`<button onclick="lesson(${i+1})">${t("nextN",i+2)}</button>`:""}</div>`;
  app.innerHTML=h;
}

/* ---------- Ασκήσεις ---------- */
let Q=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(i){Q={mode:"lesson",li:i,items:shuffle(LESSONS[i].q.map((q,k)=>({li:i,k}))).slice(0,6),pos:0,score:0,res:[]};showQ()}
function idToItem(id){const[a,b]=id.split("-").map(Number);return{li:a,k:b}}
function review(){
  if(!S.mist.length){home();return}
  Q={mode:"review",items:shuffle(S.mist.map(idToItem)).slice(0,8),pos:0,score:0,res:[]};showQ()
}
function daily(){
  const mist=shuffle(S.mist.map(idToItem)).slice(0,3);
  let from=Object.keys(S.done).map(Number);
  if(!from.length){const nx=nextLesson();from=[nx>=0?nx:0]}
  const pool=[];from.forEach(li=>LESSONS[li].q.forEach((q,k)=>{if(!mist.some(m=>m.li===li&&m.k===k))pool.push({li,k})}));
  Q={mode:"daily",items:shuffle(mist.concat(shuffle(pool).slice(0,8-mist.length))),pos:0,score:0,res:[]};showQ()
}
function optLabel(o){return o==="-"?t("noWord"):esc(tr(o))}
function fullSentence(q,ans){
  if(q[0].indexOf("___")<0) return ans;
  let s=q[0].replace(/\s*\([^)]*\)\s*$/,"").replace("___",ans==="-"?"":ans).replace(/\s+/g," ").trim();
  return s.charAt(0).toUpperCase()+s.slice(1);
}
function showQ(){
  window.scrollTo(0,0);
  const it=Q.items[Q.pos], q=LESSONS[it.li].q[it.k];
  const opts=shuffle([q[1],q[2],q[3]]);
  let h=topBar(true)+`<div class="card">`;
  h+=`<div class="qnum">${Q.mode==="review"?t("qMist"):Q.mode==="daily"?t("qDaily",it.li+1):t("qLesson",Q.li+1)}${t("qOf",Q.pos+1,Q.items.length)}</div><div class="dots">`;
  Q.items.forEach((x,k)=>h+=`<i class="${k<Q.pos?(Q.res[k]?"g":"r"):(k===Q.pos?"c":"")}"></i>`);
  h+=`</div>`;
  const p=tr(q[0]);
  if(p.charAt(0)==="="){
    const hint=p.slice(1).trim();
    h+=`<div class="q" dir="auto">${t("whichCorrect")}</div>${hint?`<div class="hint" dir="auto">${esc(hint)}</div>`:""}`;
  } else {
    const qt=p.indexOf("___")>=0? esc(p).replace("___",'<span class="blank">?</span>') : esc(p);
    if(p.indexOf("___")<0) h+=`<div class="qnum" style="margin-top:12px">${t("chooseEn")}</div>`;
    h+=`<div class="q" dir="auto">${qt}</div>`;
  }
  h+=`<div id="opts">`;
  opts.forEach(o=>h+=`<button class="opt" dir="auto" data-o="${encodeURIComponent(o)}" onclick="answer(this)">${optLabel(o)}</button>`);
  h+=`</div><div id="fb"></div></div>`;
  if(Q.mode==="lesson") h+=`<div class="nav"><button onclick="lesson(${Q.li})">${t("rule")}</button><button onclick="startQuiz(${Q.li})">${t("restart")}</button></div>`;
  app.innerHTML=h;
}
function answer(btn){
  const it=Q.items[Q.pos], q=LESSONS[it.li].q[it.k], id=it.li+"-"+it.k;
  const pick=decodeURIComponent(btn.dataset.o), ok=pick===q[1];
  document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(decodeURIComponent(b.dataset.o)===q[1])b.classList.add("right")});
  if(!ok)btn.classList.add("wrong");
  Q.res[Q.pos]=ok; if(ok)Q.score++;
  const mi=S.mist.indexOf(id);
  if(ok&&mi>=0&&Q.mode!=="lesson")S.mist.splice(mi,1);
  if(!ok&&mi<0)S.mist.push(id);
  save();
  const sent=fullSentence(q,q[1]);
  const shown=q[0].indexOf("___")<0?tr(q[1]):sent;
  const last=Q.pos===Q.items.length-1;
  document.getElementById("fb").innerHTML=`<div class="fb ${ok?"g":"r"}"><span dir="auto">${ok?t("right"):t("wrong")} ${esc(tr(q[4]))}</span><div class="rowb">${spkBtn(sent)}<span dir="auto">${esc(shown)}</span></div></div><button class="big go" style="margin-top:16px" onclick="nextQ()">${last?t("finishBtn"):t("nextBtn")}</button>`;
  document.getElementById("fb").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function nextQ(){Q.pos++;if(Q.pos<Q.items.length)showQ();else finish()}

/* ---------- Τέλος ---------- */
function finish(){
  window.scrollTo(0,0);
  const tot=Q.items.length, sc=Q.score;
  if(Q.mode==="lesson"){const p=S.done[Q.li];S.done[Q.li]=p===undefined?sc:Math.max(p,sc);S.last=today();save()}
  const st=sc>=tot?3:(sc>=tot-2?2:1);
  const msg=sc===tot?t("perfect"):(sc>=tot-2?t("veryGood"):t("goodTry"));
  let h=topBar(true)+`<div class="card center"><div class="stars">${"⭐".repeat(st)}${"☆".repeat(3-st)}</div><h2 style="margin:4px 0">${msg}</h2><div style="font-size:1.1em">${t("score",sc,tot)}</div></div>`;
  if(Q.mode==="lesson"){
    const i=Q.li;
    if(i<LESSONS.length-1) h+=`<button class="big go" onclick="lesson(${i+1})">${t("nextLesson",i+2)}</button>`;
    h+=`<div class="grid2"><button class="tile" onclick="startQuiz(${i})">${sp2(t("againLesson"))}</button><button class="tile" onclick="lesson(${i})">${sp2(t("reread"))}</button>`;
    if(S.mist.length) h+=`<button class="tile full" onclick="review()">${sp2(t("reviewMist",S.mist.length))}</button>`;
    h+=`<button class="tile full" onclick="home()">${sp2(t("homeBtn"))}</button></div>`;
    h+=`<details class="tipd"><summary>${t("tipT")}</summary><div>${t("tip6").replace(/^<b>.*?<\/b><br>/,"")}<button class="big sec" style="margin-top:12px" onclick="copyTxt(${i})">${t("copyBtn")}</button></div></details>`;
  } else {
    h+=`<button class="big go" onclick="${Q.mode==="daily"?"daily()":"review()"}">${t("oneMore")}</button><div class="grid2">`;
    if(S.mist.length&&Q.mode!=="review") h+=`<button class="tile" onclick="review()">${sp2(t("reviewMist",S.mist.length))}</button>`;
    h+=`<button class="tile${S.mist.length&&Q.mode!=="review"?"":" full"}" onclick="home()">${sp2(t("homeBtn"))}</button></div>`;
  }
  app.innerHTML=h;
}
function sp2(s){const k=s.search(/\s/);return k>0&&/^\P{L}/u.test(s)?`<span class="ti">${s.slice(0,k)}</span><span>${s.slice(k+1)}</span>`:s}
function askReset(){
  const d=document.createElement("div");d.className="modal";d.id="modal";
  d.addEventListener("click",e=>{if(e.target===d)closeModal()});
  document.body.appendChild(d);resetBox();
}
function lastDone(){const k=Object.keys(S.done).map(Number);return k.length?Math.max(...k):-1}
function resetBox(){
  const b=document.getElementById("modal");if(!b)return;const ld=lastDone();
  b.innerHTML=`<div class="box"><h2>${t("resetTitle")}</h2><div>${t("resetQ")}</div>
  ${ld>=0?`<button class="big go" onclick="stepBack()">${t("stepBack",ld+1)}</button>`:""}
  ${S.mist.length?`<button class="big sec" onclick="doReset('mist')">${t("onlyMist",S.mist.length)}</button>`:""}
  <button class="big danger" onclick="confirmAll()">${t("allProg")}</button>
  <button class="big sec" onclick="closeModal()">${t("cancel")}</button></div>`;
}
function stepBack(){
  const ld=lastDone();if(ld<0)return;
  delete S.done[ld];S.mist=S.mist.filter(x=>+x.split("-")[0]!==ld);S.last="";S.cur=ld;save();
  home();resetBox();toast(t("stepDone",ld+1));
}
function confirmAll(){document.querySelector("#modal .box").innerHTML=`<h2>${t("sure")}</h2><div>${t("sureText")}</div><button class="big danger" onclick="doReset('all')">${t("yesAll")}</button><button class="big go" onclick="closeModal()">${t("noCancel")}</button>`}
function doReset(k){
  if(k==="mist")S.mist=[];else S={done:{},mist:[],last:"",fs:S.fs||22};
  save();closeModal();home();toast(k==="mist"?t("mistCleared"):t("progCleared"));
}
function copyTxt(i){
  const x=t("copyText",i+1,tr(LESSONS[i].t).replace(/<[^>]+>/g,""));
  const done=()=>toast(t("copied"));
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(x).then(done,()=>fallback(x,done));else fallback(x,done);
}
function fallback(x,cb){const a=document.createElement("textarea");a.value=x;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}a.remove();cb()}

startApp(null,home);
if("serviceWorker" in navigator && location.protocol.startsWith("http")){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
